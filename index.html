<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Colores que transmiten calma: tonos suaves de azul verdoso y lavanda */
            background: linear-gradient(135deg, #E0F2E9 0%, #D4E6F1 50%, #E8E4F1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Manchas suaves para dar profundidad sin distraer */
        body::before,
        body::after,
        .mancha-1,
        .mancha-2 {
            content: "";
            position: fixed;
            border-radius: 50%;
            opacity: 0.4;
            pointer-events: none;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: rgba(167, 208, 225, 0.25);
            top: -100px;
            right: -50px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: rgba(193, 216, 207, 0.3);
            bottom: -80px;
            left: -50px;
        }

        .mancha-1 {
            width: 300px;
            height: 300px;
            background: rgba(210, 213, 232, 0.25);
            top: 30%;
            left: 15%;
        }

        .mancha-2 {
            width: 350px;
            height: 350px;
            background: rgba(205, 222, 229, 0.25);
            bottom: 20%;
            right: 10%;
        }

        /* Contenedor del video */
        .contenedor-video {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 
                0 10px 30px rgba(100, 130, 150, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.85);
            padding: 12px;
        }

        video, iframe {
            width: 100%;
            height: 450px;
            border: none;
            display: block;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            video, iframe {
                height: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="mancha-1"></div>
    <div class="mancha-2"></div>

    <div class="contenedor-video">
        <!-- ✅ PON TU VIDEO AQUÍ -->
        
        <!-- Opción A: Archivo de video -->
        <!-- <video src="tu-video.mp4" controls autoplay></video> -->

        <!-- Opción B: YouTube -->
        <iframe src="ENLACE_DE_TU_VIDEO" allowfullscreen></iframe>
    </div>

</body>
</html>
